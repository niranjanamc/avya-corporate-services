<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGradPrint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D899"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7B35"/>
    </linearGradient>
    <radialGradient id="discGlowPrint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0C10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="120" height="120" rx="24" fill="#0E1017"/>
  <rect width="120" height="120" rx="24" fill="url(#discGlowPrint)"/>
  <rect x="1" y="1" width="118" height="118" rx="23" stroke="#252A38" stroke-width="1.5"/>

  <!-- Architectural Gold Frame -->
  <path d="M 52 18 L 102 18 L 102 102 L 52 102 L 52 92" stroke="url(#goldGradPrint)" stroke-width="3.5" fill="none" stroke-linecap="square"/>
  <path d="M 104 20 L 107 20 L 107 104 L 104 104 Z" fill="#111111"/>

  <!-- Print Media Cylinders & Stacked Paper Layers -->
  <!-- Top Document Layer -->
  <path d="M 32 36 L 68 36 L 82 50 L 82 92 L 32 92 Z" fill="#181C26" stroke="url(#goldGradPrint)" stroke-width="2.5"/>
  <path d="M 68 36 L 68 50 L 82 50 Z" fill="url(#goldGradPrint)"/>

  <!-- Print Lines inside Document -->
  <line x1="42" y1="56" x2="64" y2="56" stroke="url(#goldGradPrint)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="66" x2="72" y2="66" stroke="url(#goldGradPrint)" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="76" x2="60" y2="76" stroke="url(#goldGradPrint)" stroke-width="2" stroke-linecap="round"/>

  <!-- Offset Press Rolling Roller Icon -->
  <rect x="22" y="74" width="48" height="14" rx="7" fill="#12141C" stroke="url(#goldGradPrint)" stroke-width="2"/>
  <circle cx="30" cy="81" r="3" fill="url(#goldGradPrint)"/>
  <circle cx="62" cy="81" r="3" fill="url(#goldGradPrint)"/>

  <!-- Precision Registration Crosshair -->
  <circle cx="86" cy="32" r="8" stroke="url(#goldGradPrint)" stroke-width="1.5" fill="none"/>
  <line x1="86" y1="20" x2="86" y2="44" stroke="url(#goldGradPrint)" stroke-width="1.5"/>
  <line x1="74" y1="32" x2="98" y2="32" stroke="url(#goldGradPrint)" stroke-width="1.5"/>
</svg>
