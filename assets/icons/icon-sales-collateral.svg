<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldCollateral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D899"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7B35"/>
    </linearGradient>
    <radialGradient id="discCollateral" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0C10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="120" height="120" rx="24" fill="#0E1017"/>
  <rect width="120" height="120" rx="24" fill="url(#discCollateral)"/>
  <rect x="1" y="1" width="118" height="118" rx="23" stroke="#252A38" stroke-width="1.5"/>

  <!-- Architectural Gold Frame -->
  <path d="M 52 18 L 102 18 L 102 102 L 52 102 L 52 92" stroke="url(#goldCollateral)" stroke-width="3.5" fill="none" stroke-linecap="square"/>
  <path d="M 104 20 L 107 20 L 107 104 L 104 104 Z" fill="#111111"/>

  <!-- Multi-fold Sales Brochure & Growth Graph -->
  <!-- Left Brochure Flap (Perspective Fold) -->
  <polygon points="26 40 46 36 46 86 26 90" fill="#151824" stroke="url(#goldCollateral)" stroke-width="2"/>
  <!-- Center Main Brochure Spread -->
  <rect x="46" y="36" width="30" height="50" fill="#1D2230" stroke="url(#goldCollateral)" stroke-width="2.5"/>
  <!-- Right Flap -->
  <polygon points="76 36 94 40 94 90 76 86" fill="#151824" stroke="url(#goldCollateral)" stroke-width="2"/>

  <!-- Inside Content Layout: Product Grid & Bar Chart -->
  <!-- Product Grid squares inside brochure -->
  <rect x="50" y="42" width="9" height="9" rx="1.5" fill="url(#goldCollateral)"/>
  <rect x="63" y="42" width="9" height="9" rx="1.5" fill="url(#goldCollateral)"/>
  
  <!-- Sales Growth Arrow & Trend Line -->
  <path d="M 32 75 L 42 68 L 60 72 L 72 58 L 88 52" stroke="url(#goldCollateral)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="88 52 82 53 85 58" fill="url(#goldCollateral)"/>

  <!-- Catalog Bullet Lines -->
  <line x1="50" y1="58" x2="68" y2="58" stroke="url(#goldCollateral)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="64" x2="72" y2="64" stroke="url(#goldCollateral)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="70" x2="65" y2="70" stroke="url(#goldCollateral)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
