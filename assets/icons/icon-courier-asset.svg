<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGradCourier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D899"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7B35"/>
    </linearGradient>
    <radialGradient id="discGlowCourier" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0C10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Obsidian Base with subtle border -->
  <rect width="120" height="120" rx="24" fill="#0E1017"/>
  <rect width="120" height="120" rx="24" fill="url(#discGlowCourier)"/>
  <rect x="1" y="1" width="118" height="118" rx="23" stroke="#252A38" stroke-width="1.5"/>

  <!-- Avya Signature Architectural Gold Offset Frame -->
  <path d="M 52 18 L 102 18 L 102 102 L 52 102 L 52 92" stroke="url(#goldGradCourier)" stroke-width="3.5" fill="none" stroke-linecap="square"/>
  <path d="M 104 20 L 107 20 L 107 104 L 104 104 Z" fill="#111111"/>

  <!-- IT Laptop Hardware & Express Courier Asset Movement -->
  <!-- Laptop Screen -->
  <rect x="28" y="38" width="46" height="30" rx="3" fill="#161922" stroke="url(#goldGradCourier)" stroke-width="2.2"/>
  <rect x="33" y="43" width="36" height="20" rx="1.5" fill="url(#goldGradCourier)" fill-opacity="0.2"/>
  <!-- Screen Checkmark / Code / Shield -->
  <path d="M 47 53 L 50 56 L 56 49" stroke="url(#goldGradCourier)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Laptop Base -->
  <path d="M 22 68 L 80 68 C 82 68 83 70 82 72 L 78 74 L 24 74 L 20 72 C 19 70 20 68 22 68 Z" fill="#1E2330" stroke="url(#goldGradCourier)" stroke-width="2"/>
  <rect x="46" y="69" width="10" height="2" rx="1" fill="url(#goldGradCourier)"/>

  <!-- Secure Delivery Parcel with Express Speed Lines -->
  <rect x="62" y="60" width="34" height="28" rx="3" fill="#161922" stroke="url(#goldGradCourier)" stroke-width="2.2"/>
  <path d="M 62 68 L 96 68" stroke="url(#goldGradCourier)" stroke-width="1.5"/>
  <path d="M 79 60 L 79 88" stroke="url(#goldGradCourier)" stroke-width="1.5"/>
  <rect x="83" y="74" width="8" height="6" rx="1" fill="url(#goldGradCourier)" fill-opacity="0.5"/>

  <!-- Fast Motion Wings / Speed Lines -->
  <path d="M 22 84 L 54 84" stroke="url(#goldGradCourier)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 32 89 L 58 89" stroke="url(#goldGradCourier)" stroke-width="2" stroke-linecap="round"/>
</svg>
