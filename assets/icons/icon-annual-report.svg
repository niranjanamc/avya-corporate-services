<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldReport" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D899"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7B35"/>
    </linearGradient>
    <radialGradient id="discReport" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0C10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="120" height="120" rx="24" fill="#0E1017"/>
  <rect width="120" height="120" rx="24" fill="url(#discReport)"/>
  <rect x="1" y="1" width="118" height="118" rx="23" stroke="#252A38" stroke-width="1.5"/>

  <!-- Architectural Gold Frame -->
  <path d="M 52 18 L 102 18 L 102 102 L 52 102 L 52 92" stroke="url(#goldReport)" stroke-width="3.5" fill="none" stroke-linecap="square"/>
  <path d="M 104 20 L 107 20 L 107 104 L 104 104 Z" fill="#111111"/>

  <!-- Hardbound Corporate Annual Report & Financial Growth Metrics -->
  <!-- Book Spine & Cover Thickness -->
  <path d="M 30 36 L 36 32 L 84 32 L 78 36 Z" fill="#242838" stroke="url(#goldReport)" stroke-width="1.5"/>
  <rect x="28" y="36" width="56" height="54" rx="4" fill="#151824" stroke="url(#goldReport)" stroke-width="2.5"/>
  <!-- Hardcover Spine Ridge -->
  <line x1="36" y1="36" x2="36" y2="90" stroke="url(#goldReport)" stroke-width="2"/>

  <!-- Ribbon Bookmark hanging from bottom -->
  <path d="M 46 90 L 46 98 L 51 95 L 56 98 L 56 90 Z" fill="url(#goldReport)"/>

  <!-- Gold Foil Embossed Crest on Annual Report Cover -->
  <rect x="44" y="44" width="32" height="18" rx="2" fill="#1C2130" stroke="url(#goldReport)" stroke-width="1.5"/>
  <line x1="48" y1="50" x2="72" y2="50" stroke="url(#goldReport)" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="55" x2="68" y2="55" stroke="url(#goldReport)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Financial Performance Bar Chart (Right side of icon) -->
  <g transform="translate(68, 62)">
    <rect x="0" y="16" width="5" height="12" rx="1" fill="url(#goldReport)" opacity="0.6"/>
    <rect x="8" y="10" width="5" height="18" rx="1" fill="url(#goldReport)" opacity="0.8"/>
    <rect x="16" y="2" width="5" height="26" rx="1" fill="url(#goldReport)"/>
  </g>
</svg>
