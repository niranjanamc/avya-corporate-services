<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldRebrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D899"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7B35"/>
    </linearGradient>
    <radialGradient id="discRebrand" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0C10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="120" height="120" rx="24" fill="#0E1017"/>
  <rect width="120" height="120" rx="24" fill="url(#discRebrand)"/>
  <rect x="1" y="1" width="118" height="118" rx="23" stroke="#252A38" stroke-width="1.5"/>

  <!-- Architectural Gold Frame -->
  <path d="M 52 18 L 102 18 L 102 102 L 52 102 L 52 92" stroke="url(#goldRebrand)" stroke-width="3.5" fill="none" stroke-linecap="square"/>
  <path d="M 104 20 L 107 20 L 107 104 L 104 104 Z" fill="#111111"/>

  <!-- Stacked Luxury Business Cards & Stationery -->
  <!-- Bottom Card Shadow Layer -->
  <rect x="26" y="52" width="60" height="36" rx="4" fill="#151822" stroke="url(#goldRebrand)" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Middle Card -->
  <rect x="32" y="44" width="60" height="36" rx="4" fill="#1A1E2B" stroke="url(#goldRebrand)" stroke-width="2"/>
  <!-- Top Active Card with Embossed Crest & Contact Lines -->
  <rect x="38" y="36" width="60" height="36" rx="4" fill="#12141C" stroke="url(#goldRebrand)" stroke-width="2.5"/>
  
  <!-- Embossed Gold Corporate Crest on Card -->
  <circle cx="50" cy="50" r="6" fill="url(#goldRebrand)"/>
  <circle cx="50" cy="50" r="4" fill="#12141C"/>
  <text x="50" y="53" text-anchor="middle" font-family="'Cinzel', serif" font-size="6" font-weight="700" fill="url(#goldRebrand)">A</text>

  <!-- Clean Corporate Text Lines -->
  <line x1="62" y1="46" x2="88" y2="46" stroke="url(#goldRebrand)" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="52" x2="82" y2="52" stroke="url(#goldRebrand)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="62" y1="58" x2="76" y2="58" stroke="url(#goldRebrand)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Executive Fountain Pen Accent -->
  <path d="M 28 88 L 48 68 L 44 64 L 24 84 Z" fill="#1E2333" stroke="url(#goldRebrand)" stroke-width="1.5"/>
  <polygon points="24 84 20 92 28 88" fill="url(#goldRebrand)"/>
</svg>
