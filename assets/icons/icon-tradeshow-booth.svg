<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldTrade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D899"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7B35"/>
    </linearGradient>
    <radialGradient id="discTrade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0C10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="120" height="120" rx="24" fill="#0E1017"/>
  <rect width="120" height="120" rx="24" fill="url(#discTrade)"/>
  <rect x="1" y="1" width="118" height="118" rx="23" stroke="#252A38" stroke-width="1.5"/>

  <!-- Architectural Gold Frame -->
  <path d="M 52 18 L 102 18 L 102 102 L 52 102 L 52 92" stroke="url(#goldTrade)" stroke-width="3.5" fill="none" stroke-linecap="square"/>
  <path d="M 104 20 L 107 20 L 107 104 L 104 104 Z" fill="#111111"/>

  <!-- Roll-up Standee & Exhibition Booth Graphics -->
  <!-- Rollup Standee (Left) -->
  <rect x="28" y="32" width="28" height="60" rx="3" fill="#181B26" stroke="url(#goldTrade)" stroke-width="2"/>
  <rect x="24" y="90" width="36" height="6" rx="2" fill="#242838" stroke="url(#goldTrade)" stroke-width="1.5"/>
  <line x1="33" y1="42" x2="51" y2="42" stroke="url(#goldTrade)" stroke-width="2" stroke-linecap="round"/>
  <line x1="33" y1="48" x2="47" y2="48" stroke="url(#goldTrade)" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="33" y="54" width="18" height="18" rx="1.5" fill="url(#goldTrade)" opacity="0.8"/>

  <!-- Trade Show Back Wall & Demo Podium (Right) -->
  <path d="M 64 36 L 94 36 L 94 88 L 64 88 Z" fill="#141722" stroke="url(#goldTrade)" stroke-width="2"/>
  <!-- Tension Fabric Curved Graphic on Wall -->
  <path d="M 68 46 C 78 40, 84 52, 90 46" stroke="url(#goldTrade)" stroke-width="2" fill="none"/>
  
  <!-- Reception / Demo Counter Desk -->
  <rect x="68" y="68" width="26" height="22" rx="2.5" fill="#1D2232" stroke="url(#goldTrade)" stroke-width="2"/>
  <line x1="72" y1="74" x2="90" y2="74" stroke="url(#goldTrade)" stroke-width="1.5"/>

  <!-- Spotlight Cone onto Standee -->
  <polygon points="42 22 34 32 50 32" fill="url(#goldTrade)" opacity="0.4"/>
  <circle cx="42" cy="20" r="2.5" fill="url(#goldTrade)"/>
</svg>
