  <polygon points="40 44 60 56 60 84 40 72" fill="#1B1F2D" stroke="url(#goldPkg)" stroke-width="2"/>
  <polygon points="60 56 94 42 94 70 60 84" fill="#12141D" stroke="url(#goldPkg)" stroke-width="2"/>

  <!-- Sliding Outer Sleeve with Custom Embossed Window -->
