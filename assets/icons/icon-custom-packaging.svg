  <path d="M 52 18 L 102 18 L 102 102 L 52 102 L 52 92" stroke="url(#goldPkg)" stroke-width="3.5" fill="none" stroke-linecap="square"/>
  <path d="M 104 20 L 107 20 L 107 104 L 104 104 Z" fill="#111111"/>

