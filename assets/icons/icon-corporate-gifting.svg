<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGradGift" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D899"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7B35"/>
    </linearGradient>
    <radialGradient id="discGlowGift" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0C10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Obsidian Base with subtle border -->
  <rect width="120" height="120" rx="24" fill="#0E1017"/>
  <rect width="120" height="120" rx="24" fill="url(#discGlowGift)"/>
  <rect x="1" y="1" width="118" height="118" rx="23" stroke="#252A38" stroke-width="1.5"/>

  <!-- Avya Signature Architectural Gold Offset Frame -->
  <path d="M 52 18 L 102 18 L 102 102 L 52 102 L 52 92" stroke="url(#goldGradGift)" stroke-width="3.5" fill="none" stroke-linecap="square"/>
  <path d="M 104 20 L 107 20 L 107 104 L 104 104 Z" fill="#111111"/>

  <!-- Stylized Luxury Gift Box -->
  <!-- Box Base -->
  <rect x="30" y="52" width="56" height="42" rx="4" fill="#161922" stroke="url(#goldGradGift)" stroke-width="2.5"/>
  <!-- Box Lid -->
  <rect x="26" y="44" width="64" height="12" rx="3" fill="#1E2330" stroke="url(#goldGradGift)" stroke-width="2.5"/>
  
  <!-- Ribbon Vertical -->
  <rect x="53" y="44" width="10" height="50" fill="url(#goldGradGift)"/>
  <!-- Ribbon Horizontal -->
  <rect x="30" y="68" width="56" height="8" fill="url(#goldGradGift)"/>

  <!-- Luxury Ribbon Bow Loop Left & Right -->
  <path d="M 58 44 C 44 32, 34 36, 42 44 C 48 48, 54 45, 58 44 Z" fill="url(#goldGradGift)"/>
  <path d="M 58 44 C 72 32, 82 36, 74 44 C 68 48, 62 45, 58 44 Z" fill="url(#goldGradGift)"/>
  <circle cx="58" cy="44" r="3.5" fill="#FFFFFF"/>

  <!-- Sparkles -->
  <path d="M 28 32 L 30 24 L 32 32 L 40 34 L 32 36 L 30 44 L 28 36 L 20 34 Z" fill="url(#goldGradGift)"/>
  <circle cx="88" cy="34" r="2" fill="url(#goldGradGift)"/>
</svg>
