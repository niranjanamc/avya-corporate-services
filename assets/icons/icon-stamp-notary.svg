<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGradStamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D899"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9E7B35"/>
    </linearGradient>
    <radialGradient id="discGlowStamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0C10" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark Obsidian Base with subtle border -->
  <rect width="120" height="120" rx="24" fill="#0E1017"/>
  <rect width="120" height="120" rx="24" fill="url(#discGlowStamp)"/>
  <rect x="1" y="1" width="118" height="118" rx="23" stroke="#252A38" stroke-width="1.5"/>

  <!-- Avya Signature Architectural Gold Offset Frame -->
  <path d="M 52 18 L 102 18 L 102 102 L 52 102 L 52 92" stroke="url(#goldGradStamp)" stroke-width="3.5" fill="none" stroke-linecap="square"/>
  <path d="M 104 20 L 107 20 L 107 104 L 104 104 Z" fill="#111111"/>

  <!-- E-Stamp Paper Document -->
  <rect x="28" y="26" width="48" height="66" rx="4" fill="#161922" stroke="url(#goldGradStamp)" stroke-width="2.5"/>
  
  <!-- Stamp Header Band (Like Gov E-Stamp header) -->
  <rect x="34" y="32" width="36" height="10" rx="2" fill="url(#goldGradStamp)" fill-opacity="0.3"/>
  <line x1="38" y1="37" x2="66" y2="37" stroke="url(#goldGradStamp)" stroke-width="1.5"/>

  <!-- Document Text Lines -->
  <line x1="34" y1="48" x2="68" y2="48" stroke="url(#goldGradStamp)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="34" y1="54" x2="68" y2="54" stroke="url(#goldGradStamp)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="34" y1="60" x2="60" y2="60" stroke="url(#goldGradStamp)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="34" y1="66" x2="52" y2="66" stroke="url(#goldGradStamp)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Official Government / Notary Seal Stamp -->
  <circle cx="76" cy="74" r="16" fill="#1E2330" stroke="url(#goldGradStamp)" stroke-width="2.5"/>
  <circle cx="76" cy="74" r="12" stroke="url(#goldGradStamp)" stroke-width="1.2" stroke-dasharray="2 2"/>
  <path d="M 76 66 L 78 71 L 83 72 L 79 76 L 80 81 L 76 78 L 71 81 L 72 76 L 68 72 L 74 71 Z" fill="url(#goldGradStamp)"/>

  <!-- Feather Quill Pen / Signatory Instrument -->
  <path d="M 94 32 C 86 38 78 48 76 56 L 74 54 C 76 46 84 36 94 32 Z" fill="url(#goldGradStamp)"/>
</svg>
