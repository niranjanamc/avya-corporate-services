<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradStamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1017"/>
      <stop offset="50%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#1A1F2E"/>
    </linearGradient>
    <radialGradient id="glowStamp" cx="75%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0E1017" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGradStamp)"/>
  <rect width="1920" height="1080" fill="url(#glowStamp)"/>

  <!-- Legal Geometry & Stamping Desk -->
  <g opacity="0.25">
    <!-- E-Stamp Document Backdrop -->
    <rect x="1250" y="240" width="460" height="620" rx="12" fill="#161B28" stroke="#C5A059" stroke-width="2.5"/>
    <!-- Stamp Header Band -->
    <rect x="1300" y="290" width="360" height="80" rx="6" fill="#C5A059" fill-opacity="0.25" stroke="#C5A059" stroke-width="1.5"/>
    <line x1="1340" y1="330" x2="1620" y2="330" stroke="#C5A059" stroke-width="3"/>
    
    <!-- Legal Clauses -->
    <line x1="1300" y1="420" x2="1660" y2="420" stroke="#C5A059" stroke-width="2" stroke-linecap="round"/>
    <line x1="1300" y1="460" x2="1660" y2="460" stroke="#C5A059" stroke-width="2" stroke-linecap="round"/>
    <line x1="1300" y1="500" x2="1580" y2="500" stroke="#C5A059" stroke-width="2" stroke-linecap="round"/>
    <line x1="1300" y1="540" x2="1520" y2="540" stroke="#C5A059" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Official Notary Public Seal -->
    <circle cx="1580" cy="720" r="54" fill="#1C2233" stroke="#C5A059" stroke-width="3"/>
    <circle cx="1580" cy="720" r="42" stroke="#C5A059" stroke-width="1.5" stroke-dasharray="4 4"/>
    <polygon points="1580,695 1588,715 1608,715 1592,728 1598,748 1580,735 1562,748 1568,728 1552,715 1572,715" fill="#C5A059"/>
  </g>
</svg>
