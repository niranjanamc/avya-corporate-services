<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradBiz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121B"/>
      <stop offset="50%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#192233"/>
    </linearGradient>
    <radialGradient id="glowBiz" cx="75%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0E121B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGradBiz)"/>
  <rect width="1920" height="1080" fill="url(#glowBiz)"/>

  <!-- Corporate Workplace Architecture -->
  <g opacity="0.18" stroke="#C5A059" stroke-width="1.2">
    <line x1="0" y1="300" x2="1920" y2="300"/>
    <line x1="0" y1="650" x2="1920" y2="650"/>
    <line x1="1100" y1="0" x2="1100" y2="1080"/>
    <line x1="1450" y1="0" x2="1450" y2="1080"/>
  </g>

  <!-- Workplace & Facility Reception Geometry -->
  <g opacity="0.25">
    <!-- Reception Desk & Executive Lounge Frame -->
    <rect x="1150" y="440" width="650" height="420" rx="16" fill="#181E2C" stroke="#C5A059" stroke-width="2"/>
    <!-- Reception Centerpiece Floral Stylization -->
    <path d="M 1475 440 Q 1475 320 1440 260 Q 1475 290 1510 260 Q 1475 320 1475 440 Z" fill="#C5A059" fill-opacity="0.5"/>
    <circle cx="1475" cy="240" r="18" fill="#C5A059" fill-opacity="0.6"/>
    <circle cx="1430" cy="260" r="14" fill="#C5A059" fill-opacity="0.4"/>
    <circle cx="1520" cy="260" r="14" fill="#C5A059" fill-opacity="0.4"/>
    <!-- Newspaper / Reading Lounge Lines -->
    <line x1="1220" y1="520" x2="1400" y2="520" stroke="#C5A059" stroke-width="3" stroke-linecap="round"/>
    <line x1="1220" y1="560" x2="1360" y2="560" stroke="#C5A059" stroke-width="2" stroke-linecap="round"/>
    <line x1="1220" y1="600" x2="1380" y2="600" stroke="#C5A059" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
