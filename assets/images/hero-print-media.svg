<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradPrint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090D"/>
      <stop offset="50%" stop-color="#111520"/>
      <stop offset="100%" stop-color="#1B1710"/>
    </linearGradient>
    <linearGradient id="goldHdrPrint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DF9E"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8E6A26"/>
    </linearGradient>
    <radialGradient id="heroGlowPrint" cx="72%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#C5A059" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#08090D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="650" fill="url(#bgGradPrint)"/>
  <rect width="1600" height="650" fill="url(#heroGlowPrint)"/>

  <!-- Architectural Gold Frame Accent -->
  <path d="M 1150 80 L 1520 80 L 1520 540 L 1150 540 L 1150 490" stroke="url(#goldHdrPrint)" stroke-width="6" fill="none" opacity="0.45"/>
  <rect x="1530" y="86" width="12" height="460" fill="#111111" opacity="0.6"/>

  <!-- Large Format Rollup Standee Visual (Right) -->
  <rect x="1320" y="160" width="140" height="340" rx="6" fill="#161822" stroke="url(#goldHdrPrint)" stroke-width="2.5"/>
  <rect x="1300" y="490" width="180" height="24" rx="4" fill="#252A3A" stroke="url(#goldHdrPrint)" stroke-width="1.5"/>
  <!-- Banner Graphics -->
  <rect x="1340" y="190" width="100" height="70" rx="3" fill="url(#goldHdrPrint)" opacity="0.85"/>
  <line x1="1340" y1="280" x2="1420" y2="280" stroke="url(#goldHdrPrint)" stroke-width="3" stroke-linecap="round"/>
  <line x1="1340" y1="300" x2="1400" y2="300" stroke="url(#goldHdrPrint)" stroke-width="2" stroke-linecap="round"/>
  <line x1="1340" y1="320" x2="1430" y2="320" stroke="url(#goldHdrPrint)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Stacked Corporate Brochures & Catalogs (Center) -->
  <!-- Brochure 1 Base -->
  <path d="M 880 340 L 1180 260 L 1260 380 L 960 460 Z" fill="#141722" stroke="url(#goldHdrPrint)" stroke-width="3"/>
  <line x1="900" y1="345" x2="1160" y2="275" stroke="url(#goldHdrPrint)" stroke-width="2"/>
  <!-- Brochure 2 Top Layer (Open Foil Stamped Cover) -->
  <path d="M 840 280 L 1140 200 L 1220 320 L 920 400 Z" fill="#1C2030" stroke="url(#goldHdrPrint)" stroke-width="3"/>
  <rect x="910" y="240" width="120" height="50" rx="3" fill="url(#goldHdrPrint)" opacity="0.9" transform="rotate(-15 910 240)"/>
  <text x="960" y="270" font-family="'Cinzel', serif" font-weight="700" font-size="14" fill="#111111" transform="rotate(-15 960 270)">AVYA PRINT</text>

  <!-- Offset Press Rolling Cylinder Illustration (Left Center) -->
  <ellipse cx="800" cy="450" rx="140" ry="40" fill="#10121A" stroke="url(#goldHdrPrint)" stroke-width="3"/>
  <rect x="660" y="320" width="280" height="130" fill="#171A26" stroke="url(#goldHdrPrint)" stroke-width="3"/>
  <ellipse cx="800" cy="320" rx="140" ry="40" fill="#202434" stroke="url(#goldHdrPrint)" stroke-width="3"/>

  <!-- Paper Ribbon Flowing Out of Press -->
  <path d="M 660 380 C 600 380, 540 430, 480 430 C 420 430, 360 370, 300 370" stroke="url(#goldHdrPrint)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 660 410 C 600 410, 540 460, 480 460 C 420 460, 360 400, 300 400" stroke="url(#goldHdrPrint)" stroke-width="3" fill="none" stroke-dasharray="6 4"/>

  <!-- Precision Color Registration Targets -->
  <g transform="translate(1080, 110)">
    <circle cx="25" cy="25" r="20" stroke="url(#goldHdrPrint)" stroke-width="2" fill="none"/>
    <line x1="25" y1="0" x2="25" y2="50" stroke="url(#goldHdrPrint)" stroke-width="2"/>
    <line x1="0" y1="25" x2="50" y2="25" stroke="url(#goldHdrPrint)" stroke-width="2"/>
    <circle cx="25" cy="25" r="5" fill="url(#goldHdrPrint)"/>
  </g>

  <!-- Sparkles & CMYK Dots -->
  <circle cx="760" cy="220" r="4" fill="url(#goldHdrPrint)"/>
  <circle cx="1240" cy="180" r="3" fill="url(#goldHdrPrint)"/>
  <circle cx="1480" cy="240" r="4" fill="url(#goldHdrPrint)"/>
</svg>
