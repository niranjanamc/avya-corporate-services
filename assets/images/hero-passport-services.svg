<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradPass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D111A"/>
      <stop offset="50%" stop-color="#131926"/>
      <stop offset="100%" stop-color="#182236"/>
    </linearGradient>
    <radialGradient id="glowPass" cx="75%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0D111A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGradPass)"/>
  <rect width="1920" height="1080" fill="url(#glowPass)"/>

  <!-- Global Business Mobility & Airport Runway Grid -->
  <g opacity="0.2" stroke="#C5A059" stroke-width="1.5">
    <ellipse cx="1480" cy="540" rx="360" ry="220" stroke-dasharray="6 6"/>
    <ellipse cx="1480" cy="540" rx="220" ry="360" stroke-dasharray="6 6"/>
  </g>

  <!-- Passport & Executive Jet Flight Vector -->
  <g opacity="0.28">
    <!-- Passport Booklet -->
    <rect x="1240" y="360" width="340" height="480" rx="12" fill="#182033" stroke="#C5A059" stroke-width="2.5"/>
    <circle cx="1410" cy="540" r="64" stroke="#C5A059" stroke-width="2.5"/>
    <ellipse cx="1410" cy="540" rx="30" ry="64" stroke="#C5A059" stroke-width="1.5"/>

    <!-- Jet Silhouette Flight Arc -->
    <path d="M 1150 780 C 1450 740 1620 540 1720 280" stroke="#C5A059" stroke-width="3" stroke-dasharray="6 6"/>
    <polygon points="1720,280 1710,310 1740,315 1745,295 1765,270" fill="#C5A059"/>
  </g>
</svg>
