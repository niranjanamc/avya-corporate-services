<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradEventHdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090D"/>
      <stop offset="50%" stop-color="#121524"/>
      <stop offset="100%" stop-color="#1D1A10"/>
    </linearGradient>
    <linearGradient id="goldHdrEvent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DF9E"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8E6A26"/>
    </linearGradient>
    <radialGradient id="heroGlowEvent" cx="72%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#C5A059" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#08090D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="650" fill="url(#bgGradEventHdr)"/>
  <rect width="1600" height="650" fill="url(#heroGlowEvent)"/>

  <!-- Architectural Gold Frame Accent -->
  <path d="M 1150 80 L 1520 80 L 1520 540 L 1150 540 L 1150 490" stroke="url(#goldHdrEvent)" stroke-width="6" fill="none" opacity="0.45"/>
  <rect x="1530" y="86" width="12" height="460" fill="#111111" opacity="0.6"/>

  <!-- Spotlights Cones from Ceiling -->
  <polygon points="980 60 840 480 1020 480" fill="url(#goldHdrEvent)" opacity="0.12"/>
  <polygon points="1380 60 1240 480 1440 480" fill="url(#goldHdrEvent)" opacity="0.12"/>

  <!-- Tech Conference Stage & Truss Architecture (Center-Right) -->
  <!-- Overhead Truss Line -->
  <rect x="800" y="100" width="660" height="24" fill="#161A26" stroke="url(#goldHdrEvent)" stroke-width="2"/>
  <line x1="800" y1="112" x2="1460" y2="112" stroke="url(#goldHdrEvent)" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- Giant Curved LED Stage Screen -->
  <rect x="860" y="150" width="540" height="280" rx="14" fill="#0C0E16" stroke="url(#goldHdrEvent)" stroke-width="3"/>
  <rect x="880" y="170" width="500" height="240" rx="8" fill="#131724"/>

  <!-- Dynamic Conference Visuals on Screen -->
  <circle cx="1130" cy="290" r="70" stroke="url(#goldHdrEvent)" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
  <polygon points="1130 240 1170 320 1090 320" fill="url(#goldHdrEvent)" opacity="0.85"/>
  <text x="1130" y="370" text-anchor="middle" font-family="'Cinzel', serif" font-weight="700" font-size="20" fill="#F8FAFC" letter-spacing="4">ANNUAL SUMMIT</text>

  <!-- Stage Deck Platform -->
  <polygon points="800 430 1460 430 1520 540 740 540" fill="#181C2A" stroke="url(#goldHdrEvent)" stroke-width="2.5"/>
  <rect x="740" y="530" width="780" height="20" fill="#0E1018"/>

  <!-- Left: Delegate Registration Desk & Entrance Arch -->
  <g transform="translate(680, 310)">
    <rect x="0" y="50" width="140" height="90" rx="4" fill="#1A1E2C" stroke="url(#goldHdrEvent)" stroke-width="2"/>
    <text x="70" y="85" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="10" fill="url(#goldHdrEvent)">REGISTRATION</text>
    <line x1="20" y1="100" x2="120" y2="100" stroke="url(#goldHdrEvent)" stroke-width="1.5"/>
  </g>

  <!-- Right: Rollup Standee -->
  <rect x="1430" y="240" width="60" height="200" rx="4" fill="#191D2B" stroke="url(#goldHdrEvent)" stroke-width="2"/>
  <line x1="1440" y1="270" x2="1480" y2="270" stroke="url(#goldHdrEvent)" stroke-width="2"/>
  <line x1="1440" y1="290" x2="1475" y2="290" stroke="url(#goldHdrEvent)" stroke-width="1.5"/>
  <line x1="1440" y1="310" x2="1470" y2="310" stroke="url(#goldHdrEvent)" stroke-width="1.5"/>
</svg>
