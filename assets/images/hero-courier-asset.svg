<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradCourier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1017"/>
      <stop offset="50%" stop-color="#121722"/>
      <stop offset="100%" stop-color="#182030"/>
    </linearGradient>
    <radialGradient id="glowCourier" cx="75%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0D1017" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGradCourier)"/>
  <rect width="1920" height="1080" fill="url(#glowCourier)"/>

  <!-- High-Tech Hardware Logistics Lines -->
  <g opacity="0.2" stroke="#C5A059" stroke-width="1.5">
    <line x1="1100" y1="780" x2="1820" y2="780"/>
    <line x1="1200" y1="840" x2="1820" y2="840"/>
  </g>

  <!-- Laptop & Courier Parcel Hardware Silhouette -->
  <g opacity="0.28">
    <!-- Corporate Computing Laptop -->
    <rect x="1200" y="380" width="360" height="230" rx="10" fill="#161C2A" stroke="#C5A059" stroke-width="2.5"/>
    <rect x="1230" y="410" width="300" height="170" rx="4" fill="#C5A059" fill-opacity="0.2"/>
    <path d="M 1150 610 L 1610 610 C 1630 610 1640 625 1630 640 L 1600 660 L 1160 660 L 1130 640 C 1120 625 1130 610 1150 610 Z" fill="#1E2638" stroke="#C5A059" stroke-width="2"/>

    <!-- Express Courier Transit Parcel -->
    <rect x="1450" y="520" width="280" height="220" rx="10" fill="#182132" stroke="#C5A059" stroke-width="2.5"/>
    <line x1="1450" y1="590" x2="1730" y2="590" stroke="#C5A059" stroke-width="2"/>
    <line x1="1590" y1="520" x2="1590" y2="740" stroke="#C5A059" stroke-width="2"/>
    <rect x="1620" y="640" width="60" height="40" rx="4" fill="#C5A059" fill-opacity="0.3"/>
  </g>
</svg>
